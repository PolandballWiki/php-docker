name: Build and push PHP base image
on:
  push:
    branches: [main]
    paths: ['dockerfiles/php-base/**', '.github/workflows/docker.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/polandballwiki/php-base
concurrency:
  group: php-base-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {fetch-depth: 0, persist-credentials: false}
    - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
      id: filter
      with:
        filters: |
          8.1: ['dockerfiles/php-base/8.1/**']
          8.3: ['dockerfiles/php-base/8.3/**']
          8.5: ['dockerfiles/php-base/8.5/**']
    - id: versions
      env:
        CHANGED: ${{ steps.filter.outputs.changes }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          echo 'versions=["8.1","8.3","8.5"]' >> "$GITHUB_OUTPUT"
        else
          echo "versions=$CHANGED" >> "$GITHUB_OUTPUT"
        fi
  build:
    needs: changes
    if: needs.changes.outputs.versions != '[]'
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.changes.outputs.versions) }}
        os:
        - {runner: ubuntu-24.04, platform: linux/amd64, arch: amd64}
        - {runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64}
    runs-on: ${{ matrix.os.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: build
      with:
        context: dockerfiles/php-base/${{ matrix.version }}
        platforms: ${{ matrix.os.platform }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-php${{ matrix.version }}-${{ matrix.os.arch }}
        cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-php${{ matrix.version }}-${{ matrix.os.arch }},mode=max
    - name: Export architecture digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: digests-${{ matrix.version }}-${{ matrix.os.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
  merge:
    if: needs.changes.outputs.versions != '[]'
    needs: [changes, build]
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        version: ${{ fromJSON(needs.changes.outputs.versions) }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-${{ matrix.version }}-*
        merge-multiple: true
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish version-specific multi-platform tags
      env:
        MINOR: ${{ matrix.version }}
      run: |
        set -euo pipefail
        full=$(sed -nE 's/^FROM php:([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "dockerfiles/php-base/$MINOR/Dockerfile")
        test "${full%.*}" = "$MINOR"
        refs=()
        for digest in "$RUNNER_TEMP"/digests/*; do
          [[ "${digest##*/}" =~ ^[0-9a-f]{64}$ ]]
          refs+=("$IMAGE_NAME@sha256:${digest##*/}")
        done
        test "${#refs[@]}" -eq 2
        tags=(-t "$IMAGE_NAME:$MINOR" -t "$IMAGE_NAME:$full" -t "$IMAGE_NAME:$MINOR-$GITHUB_RUN_NUMBER" -t "$IMAGE_NAME:$full-$GITHUB_RUN_NUMBER")
        if [ "$MINOR" = 8.5 ]; then tags+=(-t "$IMAGE_NAME:latest"); fi
        docker buildx imagetools create "${tags[@]}" "${refs[@]}"
        docker buildx imagetools inspect "$IMAGE_NAME:$full"
